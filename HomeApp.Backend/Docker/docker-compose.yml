services:
  homeapp-backend:
    image: homeapp-backend:alpine
    container_name: homeapp-backend
    build:
      context: ../
      dockerfile: Web.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__HomeAppConnection: "${HOMEAPP_DATA_CONN}"
      OAuth__Authority: "${OAuth__Authority}"
      OAuth__ValidAudiences__0: "${OAuth__ValidAudiences__0}"
    expose:
      - "8080"
    networks:
      - webnet

  nginx:
    image: nginx:alpine
    container_name: homeapp-nginx
    depends_on:
      - homeapp-backend
    ports:
      - "5018:5018"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cert.pem:/etc/nginx/cert.pem:ro
      - ./nginx/cert.key:/etc/nginx/cert.key:ro
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
